<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background-size: cover;
      background-position: center;
      transition: background-image 1s ease-in-out;
      overflow-x: hidden;
    }
    .overlay {
      background: rgba(0,0,0,0.6);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    header {
      text-align: center;
      padding: 2rem 1rem;
      color: white;
    }
    header img {
      width: 100px;
      border-radius: 100px;
      margin-bottom: 1rem;
    }
    header h1 {
      font-size: 2rem;
      animation: blink 2s infinite;
      letter-spacing: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .button-frame, .toggle-frame {
      margin: 1rem auto;
      padding: 1rem;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 4px solid;
      max-width: 600px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      animation: borderColorChange 6s infinite linear;
    }
    .toggle-frame {
      grid-template-columns: 1fr;
      max-width: 300px;
    }
    @keyframes borderColorChange {
      0%   { border-color: violet; }
      25%  { border-color: gold; }
      50%  { border-color: deepskyblue; }
      75%  { border-color: orange; }
      100% { border-color: violet; }
    }
    button {
      padding: 1rem;
      border: none;
      border-radius: 12px;
      background-color: #222222aa;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s ease;
    }
    button:hover {
      background-color: #444;
      transform: scale(1.03);
    }
    .popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      max-height: 80vh;
      overflow-y: auto;
      z-index: 999;
      width: 90%;
      max-width: 600px;
    }
    .popup-close {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 20px;
      cursor: pointer;
    }
    #snow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

  <header>

  <audio id="music" src="https://files.catbox.moe/yzyfeo.mp3" autoplay loop></audio>  <script>
    const dynamicBackgrounds = [
      'https://files.catbox.moe/55blp3.jpeg',
      'https://files.catbox.moe/b57kpb.jpg',
      'https://files.catbox.moe/qb1cdi.jpg'
    ];
    const staticBackgrounds = [
      'https://files.catbox.moe/q0idiv.jpeg',
      'https://files.catbox.moe/asdjrf.jpg'
    ];
    let useDynamic = true;
    let bgIndex = 0;

    function rotateBackgrounds() {
      if (useDynamic) {
        document.body.style.backgroundImage = `url('${dynamicBackgrounds[bgIndex]}')`;
        bgIndex = (bgIndex + 1) % dynamicBackgrounds.length;
      }
    }
    setInterval(() => { if (useDynamic) rotateBackgrounds(); }, 3000);
    rotateBackgrounds();

    function toggleBackground() {
      useDynamic = false;
      bgIndex = (bgIndex + 1) % staticBackgrounds.length;
      document.body.style.backgroundImage = `url('${staticBackgrounds[bgIndex]}')`;
    }

    let currentSong = 0;
    const songs = [
      'https://files.catbox.moe/dfzn01.mp3',
      'https://files.catbox.moe/82tj3s.mp3'
    ];
    function toggleMusic() {
      currentSong = (currentSong + 1) % songs.length;
      const music = document.getElementById('music');
      music.src = songs[currentSong];
      music.play();
    }

    function showPopup(type) {
      const popup = document.getElementById('popup');
      const content = document.getElementById('popup-content');
      let html = '';
      if (type === 'story') {
        html = `<h2>Story</h2><p style="white-space:pre-wrap">👤 Perkenalan Diri Zixun

Di usia 17 tahun, aku melangkah dengan mimpi besar. Namaku Zixun, seorang pelajar biasa yang punya satu tujuan jelas: menjadi seorang programmer. Dunia coding pertama kali terasa rumit-penuh simbol dan logika yang bikin pusing. Tapi justru di situlah aku merasa tertantang.
Aku sadar, aku bukan yang paling menonjol secara akademik. Kadang aku lambat memahami, kadang harus mengulang berkali-kali. Namun aku punya satu kekuatan: tidak mudah menyerah. Setiap hari aku mencoba belajar sedikit demi sedikit-menonton tutorial, membaca dokumentasi, dan mencoba langsung meski sering error. Bagiku, error bukan kegagalan, tapi tanda bahwa aku sedang belajar.

🎯 Cita-Cita:

Menjadi programmer, menurutku, bukan sekadar bisa menulis kode. Ini tentang berpikir kreatif, memecahkan masalah, dan menciptakan sesuatu yang bermanfaat. Aku bermimpi suatu hari nanti bisa membuat aplikasi atau website yang membantu banyak orang, dan dari sana aku bisa membanggakan diri sendiri serta orang-orang yang aku sayangi.
Perjalanan ini jelas tidak mudah. Ada rasa lelah, ada ragu, bahkan ingin berhenti. Tapi setiap kali itu datang, aku ingat satu hal: mimpiku lebih besar dari rasa takutku. Di usia 17 tahun ini, aku memilih untuk terus berjalan, satu langkah kecil setiap hari.
Namaku Zixun, dan ini baru permulaan.</p>`;
      } else if (type === 'filosofi') {
        html = `<h2>Filosofi</h2><p style="white-space:pre-wrap">Berikut adalah filosofi tentang ROSHIDERE:

•Alya (Alisa Mikhailovna Kujou)
Alya adalah protagonis wanita utama yang dikenal mandiri, cerdas, dan baik hati. Filosofi karakternya berakar pada perjuangan internal seorang tsundere klasik. Dia cenderung mendahulukan orang lain dan menyembunyikan perasaan aslinya, sampai-sampai terkadang dia sendiri bingung dengan keinginannya dalam hidup. Ciri khasnya adalah menggumamkan perasaannya (yang sebenarnya manis atau memalukan) dalam bahasa Rusia, karena teman-teman sekelasnya yang berkebangsaan Jepang tidak mengerti.

•Masha (Maria Mikhailovna Kujou)
Masha adalah kakak perempuan Alya dan menjabat sebagai sekretaris OSIS. Dia digambarkan sebagai karakter pendukung wanita yang menarik dan memiliki rahasia mengenai identitas aslinya yang terungkap di novel ringan. Dia memiliki sisi misterius dan humor, ditunjukkan dengan "pacarnya" yang ternyata adalah boneka beruang dari masa kecilnya.

•Ayano (Ayano Kimishima)
Ayano adalah karakter pendukung yang bekerja di OSIS dan memiliki sejarah sebagai mantan pelayan keluarga Masachika Kuze dan Yuki Suou. Dia adalah teman masa kecil Masachika dan sangat setia kepadanya, meskipun Masachika waspada terhadapnya sebagai saingan politik di OSIS. Ayano jarang memulai percakapan dan cenderung menyembunyikan emosinya, memprosesnya secara internal meskipun terlihat dingin. Dia tidak memiliki perasaan romantis terhadap Masachika.

•Yuki (Yuki Suou)
Yuki Suou adalah siswi tahun pertama di Akademi Swasta Seirei yang terlihat tenang dan kalem di luar, tetapi memiliki sisi tersembunyi. Dia adalah bagian penting dari dinamika cerita, bersaing dengan karakter lain untuk posisi ketua OSIS. Hubungannya dengan Masachika dan Ayano dijelaskan lebih lanjut dalam volume novel ringan selanjutnya. Dia adalah karakter yang populer di kalangan penggemar karena sifatnya yang menarik.</p>`;
      } else if (type === 'tutorial') {
        html = `<h2>Tutorial Saweria</h2>
          <img src="https://files.catbox.moe/8wtdbu.jpg" style="width:100%;margin:5px 0;">
          <img src="https://files.catbox.moe/7upnmf.jpg" style="width:100%;margin:5px 0;">
          <img src="https://files.catbox.moe/k0xbfc.jpg" style="width:100%;margin:5px 0;">
        `;
      } else if (type === 'moderator') {
        html = `<h2>List Moderator</h2><p style="white-space:pre-wrap">1. @_jauhaari.pz_
2. @bocilaa99</p>`;
      } else if (type === 'kontak') {
        html = `<h2>Kontak</h2><p>Hubungi saya via Instagram: <a href="https://ig.me/m/zixunsss">KLIK</a></p>`;
      }
      content.innerHTML = html;
      popup.style.display = 'block';
    }

    function closePopup() {
      document.getElementById('popup').style.display = 'none';
    }

    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    let snowflakes = [];

    function createSnowflakes() {
      for (let i = 0; i < 100; i++) {
        snowflakes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 4 + 1,
          speed: Math.random() * 1 + 0.5
        });
      }
    }

    function drawSnowflakes() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'white';
      ctx.beginPath();
      for (let flake of snowflakes) {
        ctx.moveTo(flake.x, flake.y);
        ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
      }
      ctx.fill();
      moveSnowflakes();
    }

    function moveSnowflakes() {
      for (let flake of snowflakes) {
        flake.y += flake.speed;
        if (flake.y > height) {
          flake.y = 0;
          flake.x = Math.random() * width;
        }
      }
    }

    function animateSnow() {
      drawSnowflakes();
      requestAnimationFrame(animateSnow);
    }

    createSnowflakes();
    animateSnow();
  </script></body>
